#网络配置 - 控制抓包的网络相关设置
wk = eth0 #指定网卡
gl_tiaojian = tcp port 80 #抓包过滤

#抓包配置 - 控制抓包行为参数
hcq_daxiao = 2048 #缓冲区大小
zd_bao = 500 #最大包数量
chaoshi = 120 #超时时间

#输出配置 - 抓包结果输出
#wjm_shuchu = my_capture.pcap #输出文件名
kzt_xianshi = true #是否在控制台显示抓包信息

#日志配置 - 日志文件相关设置
rz_dengji = info #日志等级
rz_ming = my_log.log #日志文件名
